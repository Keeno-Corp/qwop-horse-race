<!doctype html>
<!-- Made with paprika3d · https://paprika3d.com -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Finish Fiasco — Channel 7 Race of the Week</title>
<style>
@font-face{font-family:"Shrikhand";src:url("./lib/fonts/Shrikhand-Regular.ttf") format("truetype");font-display:block}
@font-face{font-family:"Bungee";src:url("./lib/fonts/Bungee-Regular.ttf") format("truetype");font-display:block}
:root{--tomato:#d3432b;--mustard:#e5af2c;--avocado:#95a641;--orange:#d06322;--blue:#305da2;--cream:#f2e1ad;--choc:#4c2c21;--ink:#2b1810}
html,body{margin:0;height:100%;overflow:hidden;background:#1a110c;font-family:"Bungee","Arial Black",Impact,sans-serif;user-select:none;color:var(--cream)}
canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important}
.ui{position:fixed;pointer-events:none;text-shadow:1px 0 rgba(255,70,40,.5),-1px 0 rgba(40,170,255,.4)}
.strip{background:var(--choc);border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.35)}
/* tote / odds board */
#tote{top:16px;left:18px;width:318px}
#tote .hd{display:flex;justify-content:space-between;align-items:center;padding:3px 10px 2px;background:var(--choc);border:3px solid var(--ink);border-bottom:0;font-size:13px;letter-spacing:1px}
#tote .hd b{font-family:"Shrikhand";font-weight:400;font-size:22px;color:var(--cream);letter-spacing:0}
#tote .hd span{color:var(--mustard)}
#tote .bar{height:6px;background:repeating-linear-gradient(90deg,var(--tomato) 0 22px,var(--mustard) 22px 44px,var(--blue) 44px 66px,var(--cream) 66px 88px);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
#tote .rows{background:#1d140f;border:3px solid var(--ink);border-top:0;padding:3px 0}
.row{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:2px 10px 2px 6px;font-size:14px;border-left:5px solid transparent}
.row.me{background:#3a2a1e;border-left-color:var(--mustard)}
.row img{width:26px;height:26px;border:2px solid var(--cream);border-radius:50%;background:#fff}
.row .nm{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.05}
.row .nm small{display:block;font-size:11px;color:var(--mustard);margin-top:1px}
.row .od{font-size:20px;color:#ffb347;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.row .od.up{color:#9be36b}.row .od.dn{color:#ff6a4a}
/* progress strip */
#prog{top:18px;left:50%;transform:translateX(-50%);width:min(30vw,380px);height:18px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.35);border-radius:3px}
#prog:before{content:"";position:absolute;inset:3px 0 3px;background:repeating-linear-gradient(90deg,#d9c58f 0 2px,transparent 2px 10%)}
#prog .fl{position:absolute;right:-3px;top:-3px;bottom:-3px;width:14px;background:repeating-conic-gradient(var(--ink) 0 25%,var(--cream) 0 50%) 0 0/7px 7px;border:3px solid var(--ink)}
#prog em{position:absolute;top:1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);margin-left:-8px;transition:left .1s}
/* bugs top-right */
#top-r{top:16px;right:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.bugs{display:flex;gap:8px;align-items:stretch}
.live{display:flex;align-items:center;gap:7px;background:var(--tomato);color:var(--cream);border:3px solid var(--ink);padding:3px 12px;font-size:18px;letter-spacing:2px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.live i{width:11px;height:11px;border-radius:50%;background:var(--cream);animation:bl 1.1s steps(2) infinite}
.chan{display:flex;align-items:center;gap:8px;background:var(--cream);color:var(--choc);border:3px solid var(--ink);padding:3px 10px;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.35);text-shadow:none}
.chan b{background:var(--blue);color:var(--cream);padding:1px 8px;border-radius:3px;font-size:19px}
#timer{font-size:14px;background:var(--choc);border:3px solid var(--ink);padding:2px 10px;color:var(--mustard)}
.btns{pointer-events:auto;display:flex;gap:6px}
.btns button{font:inherit;font-size:12px;background:var(--cream);color:var(--choc);border:3px solid var(--ink);border-radius:3px;padding:4px 9px;cursor:pointer;text-shadow:none;box-shadow:0 3px 0 var(--ink)}
.btns button.on{background:var(--mustard);box-shadow:0 3px 0 var(--tomato)}
.btns button:active{transform:translateY(3px);box-shadow:none}
/* lower third */
#lower{left:3vw;bottom:44px;width:min(56vw,700px)}
#lower .tag{display:inline-block;background:var(--mustard);color:var(--choc);border:3px solid var(--ink);border-bottom:0;padding:2px 14px 1px;font-size:13px;letter-spacing:1px;text-shadow:none;transform:skewX(-8deg);margin-left:10px}
#lower .tag b{color:var(--tomato)}
#lower .line{display:block;background:linear-gradient(90deg,var(--choc),#6a3b28);border:3px solid var(--ink);border-left:12px solid var(--tomato);box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 -4px 0 var(--mustard);padding:7px 16px 10px;font-size:clamp(15px,1.7vw,22px);line-height:1.15;min-height:1.2em;color:var(--cream)}
#lower.flash .line{animation:none}
@keyframes lt{0%{left:calc(3vw - 40px);opacity:.3}100%{left:3vw;opacity:1}}
/* keys + ticker */
#keys{bottom:46px;right:18px;display:flex;gap:22px}
.kp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--cream)}
.kp .row{display:flex;gap:7px;padding:0;border:0;background:none}
.cap{width:44px;height:44px;border-radius:6px;background:var(--cream);color:var(--choc);border:3px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:19px;text-shadow:none;line-height:1;box-shadow:0 5px 0 var(--ink);transition:transform .05s}
.cap small{font-size:8px;opacity:.7;margin-top:2px}.cap.dn{transform:translateY(5px);box-shadow:0 0 0 var(--ink);background:var(--mustard)}
#tips{left:0;right:0;bottom:0;height:26px;display:flex;align-items:center;justify-content:center;font-size:12px;letter-spacing:.5px;background:var(--ink);color:var(--cream);border-top:3px solid var(--mustard);white-space:nowrap;overflow:hidden}
/* popups + countdown */
#popups{inset:0}
.pop{position:absolute;text-align:center;font-family:"Shrikhand",serif;font-size:clamp(34px,5.6vw,84px);line-height:1;white-space:nowrap;color:var(--cream);padding:6px 30px 12px;background:var(--tomato);border:5px solid var(--ink);box-shadow:8px 8px 0 var(--ink);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink)}
.pop span{display:block;font-family:"Bungee";font-size:.26em;margin-top:6px;-webkit-text-stroke:0;color:var(--cream);text-shadow:2px 2px 0 var(--ink);letter-spacing:1px}
body.replaying .pop{top:30vh!important}
#count{inset:0;display:flex;align-items:flex-start;justify-content:center;padding-top:9vh;font-family:"Shrikhand",serif;font-size:clamp(90px,15vw,200px);-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:8px 8px 0 var(--ink)}
/* title card */
#title{inset:0;display:none;align-items:center;justify-content:center}
#title .card{background:var(--cream);color:var(--choc);border:6px solid var(--ink);box-shadow:12px 12px 0 var(--ink);padding:0 0 18px;text-align:center;width:min(78vw,820px);overflow:hidden;text-shadow:none;transform:rotate(-1.5deg);animation:tc .5s ease-out}
#title .st{height:30px;background:repeating-linear-gradient(90deg,var(--tomato) 0 40px,var(--mustard) 40px 80px,var(--blue) 80px 120px,var(--avocado) 120px 160px)}
#title .k{font-size:clamp(13px,1.5vw,17px);letter-spacing:3px;margin:14px 0 2px;color:var(--tomato)}
#title h1{margin:0;font-family:"Shrikhand",serif;font-weight:400;font-size:clamp(34px,6.2vw,76px);line-height:1;color:var(--choc);text-shadow:4px 4px 0 var(--mustard)}
#title .s{margin-top:10px;font-size:clamp(13px,1.7vw,19px);letter-spacing:1px}
#title .s b{color:var(--blue)}
@keyframes tc{0%{transform:rotate(-1.5deg) scale(.5)}100%{transform:rotate(-1.5deg) scale(1);opacity:1}}
/* replay */
#replay{inset:0;display:none}
#replay .bar{position:absolute;left:0;right:0;height:7vh;background:var(--ink)}
#replay .t{top:0}#replay .b{bottom:0}
#replay .tag{position:absolute;top:10vh;left:3vw;font-size:clamp(20px,3vw,40px);color:var(--cream);background:var(--tomato);border:4px solid var(--ink);padding:2px 22px;box-shadow:6px 6px 0 var(--ink);letter-spacing:3px;transform:skewX(-8deg)}
#replay .tag i{display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--cream);margin-right:.35em;animation:bl .8s steps(2) infinite}
#replay .sk{position:absolute;bottom:9vh;left:50%;transform:translateX(-50%);font-size:14px}
#pf{inset:0;display:none}
#pf .fr{position:absolute;inset:7vh 7vw;border:18px solid #efe2bd;box-shadow:inset 0 0 0 3px #3a2a1e,inset 0 0 90px rgba(40,20,5,.65),0 0 0 4px var(--ink);background:none}
#pf .fr:before,#pf .fr:after{content:"";position:absolute;top:-3px;bottom:-3px;width:14px;background:repeating-linear-gradient(#1a110c 0 16px,transparent 16px 34px)}
#pf .fr:before{left:-16px}#pf .fr:after{right:-16px}
#pf .hair{position:absolute;top:7vh;bottom:7vh;left:50%;width:2px;background:rgba(255,235,190,.55);margin-left:-1px}
#pf .cap2{position:absolute;left:50%;top:9vh;transform:translateX(-50%);font-family:"Shrikhand",serif;font-size:clamp(28px,5vw,64px);color:#efe2bd;text-shadow:3px 3px 0 #3a2a1e;letter-spacing:2px;white-space:nowrap}
#pf .cap3{position:absolute;left:50%;bottom:9.5vh;transform:translateX(-50%);font-size:clamp(13px,1.6vw,20px);color:#efe2bd;background:rgba(40,25,15,.8);padding:3px 16px;border:2px solid #efe2bd;white-space:nowrap}
body.replaying #tote,body.replaying #prog,body.replaying #top-r,body.replaying #tips,body.replaying #keys,body.replaying #lower{opacity:0}
body.replaying #replay .sk{display:block}
body.pfin #replay .bar{display:none}
body.pfin .pop{display:none}
body.pfin #replay .tag{top:auto;bottom:12vh;left:9vw;font-size:clamp(14px,1.8vw,24px);padding:1px 14px;border-width:3px;box-shadow:4px 4px 0 var(--ink)}
body.pfin #replay .sk{bottom:10.5vh;left:auto;right:9vw;transform:none}
@keyframes bl{50%{opacity:.15}}
#flash{inset:0;background:var(--cream);opacity:0}
/* results */
#results{inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;background:radial-gradient(ellipse at center,rgba(30,15,8,.1),rgba(30,15,8,.55))}
#results .box{background:var(--cream);color:var(--choc);border:6px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:0 26px 16px;min-width:min(88vw,660px);text-align:center;text-shadow:none;pointer-events:auto;overflow:hidden}
#results .box:before{content:"";display:block;height:26px;margin:0 -26px 10px;background:repeating-linear-gradient(90deg,var(--tomato) 0 40px,var(--mustard) 40px 80px,var(--blue) 80px 120px,var(--avocado) 120px 160px)}
#results h1{margin:0 0 4px;font-family:"Shrikhand",serif;font-weight:400;font-size:38px;color:var(--tomato);text-shadow:3px 3px 0 var(--mustard)}
#results h1 small{display:block;font-family:"Bungee";font-size:13px;color:var(--choc);text-shadow:none;letter-spacing:2px}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:128px;margin:10px 0}
.pod div{width:116px;border:4px solid var(--ink);border-bottom:0;display:flex;flex-direction:column;align-items:center;padding-top:6px;font-size:12px;color:var(--choc);background:var(--mustard)}
.pod div b{font-size:26px}.pod .p1{height:128px}.pod .p2{height:92px;background:#d9d2c0}.pod .p3{height:66px;background:#d9955a}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 8px;border-bottom:2px dashed #b9a56e;text-align:left}td.n{text-align:right}
td i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);margin-right:6px;vertical-align:-2px}
.award{display:inline-block;background:var(--tomato);color:var(--cream);border:2px solid var(--ink);padding:1px 7px;font-size:10px;margin-left:6px}
.award.g{background:var(--avocado)}.hint{margin-top:10px;font-size:12px;color:var(--blue)}
/* CRT sheen over the whole page (readable) */
#crt{inset:0;z-index:50;background:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 62%,rgba(20,8,0,.28) 100%)}
</style></head>
<body>
<div id="tote" class="ui"></div>
<div id="prog" class="ui"><div class="fl"></div></div>
<div id="top-r" class="ui">
 <div class="bugs"><div class="live"><i></i>LIVE</div><div class="chan"><b>7</b><span id="clock">3:58 PM</span></div></div>
 <div id="timer">RACE TIME 0.0s</div>
 <div class="btns"><button id="b1">1 PLAYER</button><button id="b2">2 PLAYERS (2)</button><button id="br">RESTART</button></div></div>
<div id="lower" class="ui"><span class="tag"><b>●</b> PLAY-BY-PLAY · <span id="cname">WALT DUNMORE</span></span><span class="line" id="ltxt"></span></div>
<div id="keys" class="ui"></div>
<div id="tips" class="ui"></div>
<div id="popups" class="ui"></div>
<div id="count" class="ui"></div>
<div id="title" class="ui"><div class="card"><div class="st"></div><div class="k">CHANNEL 7 · RACE OF THE WEEK · IN LIVING COLOR</div><h1>The Photo Finish<br>Fiasco Stakes</h1><div class="s">SIXTY METRES OF DIRT · FOUR RIDERLESS ENTRANTS · <b>NO REFUNDS</b></div></div></div>
<div id="flash" class="ui"></div>
<div id="replay" class="ui"><div class="bar t"></div><div class="bar b"></div><div class="tag"><i></i><span id="rtag">INSTANT REPLAY</span></div><div class="sk">SPACE to skip</div></div>
<div id="pf" class="ui"><div class="fr"></div><div class="hair"></div><div class="cap2">PHOTO FINISH</div><div class="cap3" id="pfc"></div></div>

<div id="crt" class="ui"></div>
