<!doctype html>
<!-- Made with paprika3d · https://paprika3d.com -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Photo Finish Fiasco — QWOP horse race</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#7bbaff;font-family:"Arial Black",Impact,system-ui,sans-serif;user-select:none}
canvas{display:block}
.ui{position:fixed;pointer-events:none;color:#fff6e0;text-shadow:0 2px 0 #3a2416,2px 0 0 #3a2416,-2px 0 0 #3a2416,0 -2px 0 #3a2416}
#chips{top:12px;left:14px;display:flex;flex-direction:column;gap:5px}
.chip{display:flex;align-items:center;gap:8px;background:#3a2416d9;border:2px solid #fff6e0;border-radius:10px;padding:3px 10px 3px 6px;font-size:14px;min-width:210px;text-shadow:none}
.chip i{width:16px;height:16px;border-radius:50%;border:2px solid #fff6e0;display:inline-block}
.chip b{flex:1;font-weight:900;letter-spacing:.5px}.chip s{text-decoration:none;color:#ffd27a;font-size:12px}.chip.me{outline:3px solid #ffd27a}
#prog{top:12px;left:50%;transform:translateX(-50%);width:min(36vw,460px);height:22px;background:#3a2416d9;border:3px solid #fff6e0;border-radius:14px}
#prog .fl{position:absolute;right:-3px;top:-6px;bottom:-6px;width:8px;background:repeating-linear-gradient(#fff 0 4px,#111 4px 8px);border-radius:2px}
#prog em{position:absolute;top:2px;width:14px;height:14px;border-radius:50%;border:2px solid #fff6e0;margin-left:-8px;transition:left .1s}
#top-r{top:12px;right:14px;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
#timer{font-size:30px}
.btns{pointer-events:auto;display:flex;gap:6px}
.btns button{font:900 13px "Arial Black",Impact,sans-serif;background:#fff6e0;color:#3a2416;border:3px solid #3a2416;border-radius:10px;padding:5px 10px;cursor:pointer;text-shadow:none}
.btns button.on{background:#ffd27a;box-shadow:0 0 0 3px #d93a2e}
#keys{bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:30px}
.kp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.kp .row{display:flex;gap:8px}
.cap{width:46px;height:46px;border-radius:10px;background:#fff6e0;color:#3a2416;border:3px solid #3a2416;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;text-shadow:none;line-height:1;box-shadow:0 5px 0 #3a2416;transition:transform .05s}
.cap small{font-size:9px;opacity:.7;margin-top:2px}.cap.dn{transform:translateY(5px);box-shadow:0 0 0 #3a2416;background:#ffd27a}
#popups{inset:0}
.pop{position:absolute;text-align:center;font-size:clamp(40px,8vw,110px);line-height:1;white-space:nowrap;-webkit-text-stroke:3px #3a2416;paint-order:stroke fill;text-shadow:0 8px 0 #3a2416}
.pop span{display:block;font-size:.28em;margin-top:6px;-webkit-text-stroke:2px #3a2416}
#count{inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(120px,24vw,320px);-webkit-text-stroke:5px #3a2416;paint-order:stroke fill}
#replay{inset:0;display:none}
#replay .bar{position:absolute;left:0;right:0;height:9vh;background:#000}
#replay .t{top:0}#replay .b{bottom:0}
#replay .tag{position:absolute;top:11vh;left:3vw;font-size:clamp(30px,5vw,64px);color:#fff;background:#d93a2e;border:4px solid #fff;padding:2px 22px;border-radius:12px;text-shadow:0 4px 0 #7a1010;letter-spacing:4px}
#replay .tag i{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:#fff;margin-right:.35em;animation:bl .8s steps(2) infinite}
#replay .sk{position:absolute;bottom:11vh;left:50%;transform:translateX(-50%);font-size:18px}
body.replaying #chips,body.replaying #prog,body.replaying #top-r,body.replaying #tips,body.replaying #keys{opacity:0}
@keyframes bl{50%{opacity:.15}}
#flash{inset:0;background:#fff;opacity:0}
#results{inset:0;display:none;align-items:center;justify-content:center;pointer-events:none}
#results .box{background:#3a2416ea;border:5px solid #fff6e0;border-radius:22px;padding:18px 28px;min-width:min(88vw,640px);text-align:center;text-shadow:none;pointer-events:auto}
#results h1{margin:0 0 10px;font-size:34px;color:#ffd27a;letter-spacing:2px}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:10px;height:150px;margin-bottom:12px}
.pod div{width:120px;border:3px solid #fff6e0;border-bottom:0;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;font-size:13px;color:#3a2416;background:#ffd27a}
.pod div b{font-size:26px}.pod .p1{height:150px;background:#ffd27a}.pod .p2{height:110px;background:#d9d9d9}.pod .p3{height:80px;background:#d9955a}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:4px 8px;border-bottom:1px solid #fff6e055;text-align:left}td.n{text-align:right}
td i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #fff6e0;margin-right:6px;vertical-align:-2px}
.award{display:inline-block;background:#d93a2e;border:2px solid #fff6e0;border-radius:8px;padding:1px 7px;font-size:11px;margin-left:6px}
.award.g{background:#3fb04a}.hint{margin-top:10px;font-size:13px;color:#ffd27a}
#tips{bottom:98px;left:50%;transform:translateX(-50%);font-size:14px;text-align:center;opacity:.95}
@keyframes pop{0%{transform:translate(-50%,0) scale(.2) rotate(var(--r));opacity:0}12%{transform:translate(-50%,0) scale(1.25) rotate(var(--r));opacity:1}22%{transform:translate(-50%,0) scale(1) rotate(var(--r))}80%{opacity:1}100%{transform:translate(-50%,-40px) scale(1) rotate(var(--r));opacity:0}}
</style></head>
<body>
<div id="chips" class="ui"></div>
<div id="prog" class="ui"><div class="fl"></div></div>
<div id="top-r" class="ui"><div id="timer">0.0</div>
 <div class="btns"><button id="b1">1 PLAYER</button><button id="b2">2 PLAYERS (2)</button><button id="br">RESTART</button></div></div>
<div id="tips" class="ui"></div>
<div id="keys" class="ui"></div>
<div id="popups" class="ui"></div>
<div id="count" class="ui"></div>
<div id="flash" class="ui"></div>
<div id="replay" class="ui"><div class="bar t"></div><div class="bar b"></div><div class="tag"><i></i>REPLAY</div><div class="sk">SPACE to skip</div></div>
<div id="results" class="ui"><div class="box"></div></div>
<script type="importmap">{"imports":{"three":"./lib/three/three.module.js","three/addons/":"./lib/addons/","@dimforge/rapier3d-compat":"./lib/rapier/rapier.mjs"}}</script>
<script type="module" src="./game.js"></script>
</body></html>
